<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>編集モード</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
}

#toolbar{
  position:sticky;
  top:0;
  background:white;
  padding:10px;
  border-bottom:1px solid #ccc;
  z-index:1000;
}

#map{
  position:relative;
}

#map img{
  width:100%;
  display:block;
}

.machine{
  position:absolute;
  width:40px;
  height:40px;
  border:2px solid black;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  touch-action:none;
}
</style>
</head>
<body>

<div id="toolbar">
  編集モード
</div>

<div id="map">

<img src="IMG_0360.jpeg">
<img src="IMG_0367.jpeg">

<div class="machine" id="m919"
style="left:100px;top:100px;">
919
</div>

</div>

<script>

const box = document.getElementById("m919");

let dragging = false;
let offsetX = 0;
let offsetY = 0;

box.addEventListener("pointerdown",(e)=>{

  dragging=true;

  offsetX=e.offsetX;
  offsetY=e.offsetY;

});

document.addEventListener("pointermove",(e)=>{

  if(!dragging) return;

  box.style.left=(e.pageX-offsetX)+"px";
  box.style.top=(e.pageY-offsetY)+"px";

});

document.addEventListener("pointerup",()=>{

  dragging=false;

});

</script>

</body>
</html>
