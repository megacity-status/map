<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
set,
onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAcnvQhTLx0bOFxJzCI9BsqAoF1PuXLB5w",
  authDomain: "megacity-b2008.firebaseapp.com",
  databaseURL: "https://megacity-b2008-default-rtdb.firebaseio.com",
  projectId: "megacity-b2008",
  storageBucket: "megacity-b2008.firebasestorage.app",
  messagingSenderId: "590830759357",
  appId: "1:590830759357:web:aa0b48d8ff6721d299b6d4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const box = document.getElementById("m919");

let dragging=false;
let offsetX=0;
let offsetY=0;

onValue(ref(db,"positions/919"),snap=>{

  const pos=snap.val();

  if(!pos) return;

  box.style.left=pos.x+"px";
  box.style.top=pos.y+"px";

});

box.addEventListener("pointerdown",(e)=>{

  dragging=true;

  offsetX=e.offsetX;
  offsetY=e.offsetY;

});

document.addEventListener("pointermove",(e)=>{

  if(!dragging) return;

  box.style.left=(e.pageX-offsetX)+"px";
  box.style.top=(e.pageY-offsetY)+"px";

});

document.addEventListener("pointerup",()=>{

  if(!dragging) return;

  dragging=false;

  set(ref(db,"positions/919"),{
    x:parseInt(box.style.left),
    y:parseInt(box.style.top)
  });

});

</script>
