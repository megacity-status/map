<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メガシティ静岡 状況マップ</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
}

#toolbar{
    position:sticky;
    top:0;
    background:white;
    padding:10px;
    border-bottom:1px solid #ccc;
    z-index:1000;
}

#mapWrapper{
    position:relative;
    width:100%;
    max-width:1040px;
    margin:auto;
}

#mapImage{
    width:100%;
    display:block;
}

.machine{
    position:absolute;

    width:7.0%;
    aspect-ratio:16/9;

    border:2px solid #000;
    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(20px,0.8vw,14px);
    font-weight:bold;

    box-sizing:border-box;
    cursor:pointer;
    user-select:none;
}

.red{
    background:red !important;
}

.yellow{
    background:yellow !important;
}
</style>
</head>

<body>

<div id="toolbar">
    <button id="resetBtn">全リセット</button>
</div>

<div id="mapWrapper">

    <img
        id="mapImage"
        <img src="IMG_0397.jpeg" class="mapImage">
        alt="島図"
    >

    <!-- 919～924 -->

    <div class="machine"
         data-id="919"
         style="left:16.9%;top:5.7%;">
         919
    </div>

    <div class="machine"
         data-id="920"
         style="left:23.6%;top:5.7%;">
         920
    </div>

    <div class="machine"
         data-id="921"
         style="left:30.2%;top:5.7%;">
         921
    </div>

    <div class="machine"
         data-id="922"
         style="left:36.8%;top:5.7%;">
         922
    </div>

    <div class="machine"
         data-id="923"
         style="left:43.5%;top:5.7%;">
         923
    </div>

    <div class="machine"
         data-id="924"
         style="left:50.1%;top:5.7%;">
         924
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAcnvQhTLx0bOFxJzCI9BsqAoF1PuXLB5w",
  authDomain: "megacity-b2008.firebaseapp.com",
  databaseURL: "https://megacity-b2008-default-rtdb.firebaseio.com",
  projectId: "megacity-b2008",
  storageBucket: "megacity-b2008.firebasestorage.app",
  messagingSenderId: "590830759357",
  appId: "1:590830759357:web:aa0b48d8ff6721d299b6d4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function nextColor(current){
    if(current === "white") return "red";
    if(current === "red") return "yellow";
    return "white";
}

document.querySelectorAll(".machine")
.forEach(btn => {

    const id = btn.dataset.id;

    onValue(ref(db,"machines/" + id), snap => {

        const color = snap.val() || "white";

        btn.classList.remove("red","yellow");

        if(color === "red"){
            btn.classList.add("red");
        }

        if(color === "yellow"){
            btn.classList.add("yellow");
        }

    });

    btn.addEventListener("click", () => {

        let current = "white";

        if(btn.classList.contains("red")){
            current = "red";
        }

        if(btn.classList.contains("yellow")){
            current = "yellow";
        }

        set(
            ref(db,"machines/" + id),
            nextColor(current)
        );

    });

});

document
.getElementById("resetBtn")
.addEventListener("click", () => {

    if(confirm("全台リセットしますか？")){
        set(ref(db,"machines"), {});
    }

});

</script>

</body>
</html>
