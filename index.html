<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メガシティ静岡 台状況</title>
<style>
body{
margin:0;
font-family:sans-serif;
overflow:auto;
background:#f5f5f5;
}
#legend{
position:sticky;
top:0;
z-index:1000;
background:white;
padding:10px;
border-bottom:1px solid #ccc;
display:flex;
gap:20px;
}
.box{
width:20px;
height:20px;
display:inline-block;
border:1px solid #000;
margin-right:5px;
vertical-align:middle;
}
.white{background:white;}
.red{background:#ff4d4d;}
.yellow{background:#ffe94d;}
#map{
position:relative;
width:1200px;
height:800px;
margin:20px;
}
.machine{
position:absolute;
width:60px;
height:35px;
border:1px solid black;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
cursor:pointer;
user-select:none;
}
.machine.red{
background:#ff4d4d;
}
.machine.yellow{
background:#ffe94d;
}
</style>
</head>
<body>
<div id="legend">
<div><span class="box white"></span>空き</div>
<div><span class="box red"></span>埋まり</div>
</div>
<div id="map">
<div class="machine" data-id="1163" style="left:100px;top:100px;">1163</div>
<div class="machine" data-id="1164" style="left:165px;top:100px;">1164</div>
<div class="machine" data-id="1165" style="left:230px;top:100px;">1165</div>
<div class="machine" data-id="1166" style="left:295px;top:100px;">1166</div>
<div class="machine" data-id="1167" style="left:100px;top:145px;">1167</div>
<div class="machine" data-id="1168" style="left:165px;top:145px;">1168</div>
<div class="machine" data-id="1169" style="left:230px;top:145px;">1169</div>
<div class="machine" data-id="1170" style="left:295px;top:145px;">1170</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getDatabase,
ref,
set,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
apiKey: "AIzaSyAcnvQhTLx0bOFxJzCI9BsqAoF1PuXLB5w",
authDomain: "megacity-b2008.firebaseapp.com",
databaseURL: "https://megacity-b2008-default-rtdb.firebaseio.com",
projectId: "megacity-b2008",
storageBucket: "megacity-b2008.firebasestorage.app",
messagingSenderId: "590830759357",
appId: "1:590830759357:web:aa0b48d8ff6721d299b6d4"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
function nextColor(current){
if(current==="white") return "red";
if(current==="red") return "yellow";
return "white";
}
document.querySelectorAll(".machine").forEach(btn=>{
const id = btn.dataset.id;
onValue(ref(db,"machines/"+id),(snap)=>{
const color = snap.val() || "white";
btn.classList.remove("red","yellow");
if(color==="red"){
btn.classList.add("red");
}
if(color==="yellow"){
btn.classList.add("yellow");
}
});
btn.addEventListener("click",()=>{
let current="white";
if(btn.classList.contains("red")){
current="red";
}
if(btn.classList.contains("yellow")){
current="yellow";
}
set(
ref(db,"machines/"+id),
nextColor(current)
);
});
});
</script>
</body>
</html>
